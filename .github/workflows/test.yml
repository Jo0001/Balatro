name: Test

on:
  push:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Build, Tests and Coverage
        run: sbt "cleanFull; clean; coverage; testFull; coverageReport"

      - name: Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/test-reports/*.xml"
          check_name: Test Results
          require_tests: true

      - name: Coverage Summary
        if: always()
        run: |
          f=$(find . -name scoverage.xml | head -n1)
          stmt=$(grep -o 'statement-rate="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
          branch=$(grep -o 'branch-rate="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
          {
            echo "### Coverage"
            echo "- Statements: ${stmt}%"
            echo "- Branches: ${branch}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage-Report
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: scoverage-report
          path: "**/scoverage-report"
          if-no-files-found: error