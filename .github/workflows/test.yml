name: Test

on:
  push:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1

      - name: Build, Tests and Coverage
        run: sbt "cleanFull; clean; coverage; testFull; coverageReport"

      - name: Test Report
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3  # v5
        with:
          report_paths: "**/test-reports/*.xml"
          check_name: Test Results
          require_tests: true

      - name: Coverage Summary
        if: always()
        run: |
          f=$(find . -name scoverage.xml | head -n1)
          stmt=$(grep -o 'statement-rate="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
          branch=$(grep -o 'branch-rate="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
          {
            echo "### Coverage"
            echo "- Statements: ${stmt}%"
            echo "- Branches: ${branch}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Filter ignored statements for Sonar
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          for f in glob.glob("**/scoverage-report/scoverage.xml", recursive=True):
              tree = ET.parse(f)
              parents = {c: p for p in tree.iter() for c in p}
              total = removed = 0
              for el in list(tree.iter("statement")):
                  total += 1
                  if el.get("ignored") == "true":
                      parents[el].remove(el)
                      removed += 1
              out = f.replace("scoverage.xml", "scoverage-sonar.xml")
              tree.write(out, encoding="UTF-8", xml_declaration=True)
              print(f"{f}: {removed} ignored of {total} statements -> {out}")
          EOF      

      - name: Locate scoverage report
        id: scoverage
        if: always()
        run: |
          paths=$(find . -name scoverage-sonar.xml | paste -sd, -)
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        if: steps.scoverage.outputs.paths != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.scala.coverage.reportPaths=${{ steps.scoverage.outputs.paths }}   

      - name: Upload Coverage-Report
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: scoverage-report
          path: "**/scoverage-report"
          if-no-files-found: error